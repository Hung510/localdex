name: Build1

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Giúp hiện nút "Run workflow" thủ công trên GitHub Actions

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version from tag or manual trigger
        id: version
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "versionCode=10000" >> "$GITHUB_OUTPUT"
            echo "Releasing manual run as versionCode 10000"
          else
            if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Tag '${TAG}' is not a vMAJOR.MINOR.PATCH release tag." >&2
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            code=$(( major * 10000 + minor * 100 + patch ))
            echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
            echo "versionCode=${code}" >> "$GITHUB_OUTPUT"
            echo "Releasing ${TAG} as versionCode ${code}"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Align version for build
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          code="${{ steps.version.outputs.versionCode }}"
          sed -i -E "s/(versionName\s*=\s*)\"[^\"]+\"/\1\"${version}\"/" app/build.gradle.kts
          sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1${code}/" app/build.gradle.kts
          grep -E 'versionName|versionCode' app/build.gradle.kts

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage APK with release name
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release/localdex-${{ steps.version.outputs.version }}-debug.apk"
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
